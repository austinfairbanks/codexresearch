[project]
name = "sole-research"
version = "0.1.0"
description = "Local-first evidence-to-outline research workbench"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "bibtexparser>=1.4,<2",
  "httpx>=0.27,<1",
  "pypdf>=5,<7",
  "trafilatura>=2,<3",
]

[project.scripts]
sole-research = "soleresearch.cli:main"

[dependency-groups]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soleresearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
